[build]
builder = "NIXPACKS"
watchPatterns = [
  "app/**",
  "data/catalog/**",
  "data/processed/**",
  "pyproject.toml",
  "requirements.txt",
  "railway.toml",
]

[deploy]
startCommand = "uvicorn app.api:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
