[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "app/**",
  "data/catalog/**",
  "data/processed/**",
  "pyproject.toml",
  "requirements.txt",
  "railway.toml",
  "nixpacks.toml",
  ".python-version",
  "Dockerfile",
]

[deploy]
# Wrap in sh -c so Railway expands $PORT (a literal "$PORT" crashes Uvicorn).
startCommand = "sh -c 'uvicorn app.api:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
