name: Refresh Groww corpus

# Scheduled re-ingest. Re-fetches the catalogued groww.in snapshots, verifies that no
# scheme lost a fact, rebuilds chunks.jsonl, and commits only when the corpus actually
# changed. A failed verification commits nothing and leaves the last good corpus live.

on:
  schedule:
    # 01:30 UTC daily (07:00 IST), after Groww's overnight scheme-data update.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and verify only; commit nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-corpus
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0" "httpx>=0.27.0"

      - name: Refresh snapshots and rebuild the corpus
        env:
          REFRESH_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -o pipefail
          extra=""
          if [ "$REFRESH_DRY_RUN" = "true" ]; then
            extra="--dry-run"
          fi
          python -m app.corpus.refresh $extra | tee refresh.log

      - name: Verify the rebuilt corpus
        run: python -m pytest -q

      - name: Detect corpus changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          git status --porcelain -- data

      - name: Commit the refreshed corpus
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh Groww corpus snapshots and chunk dates (automated)"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Groww corpus refresh"
            echo
            if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
              echo "Corpus changed and was committed."
            else
              echo "No change: every catalogued page still parses to the same facts."
            fi
            echo
            echo '```'
            cat refresh.log 2>/dev/null || echo "refresh did not produce a log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload refresh manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-manifest
          path: |
            data/processed/refresh-manifest.json
            refresh.log
          if-no-files-found: ignore
