# Force Python so web/package.json does not switch the build to Node.
providers = ["python"]

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -r requirements.txt",
]

[start]
# Shell expansion required so $PORT is a number, not the literal string "$PORT".
cmd = "sh -c 'uvicorn app.api:app --host 0.0.0.0 --port $PORT'"
