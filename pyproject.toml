[project]
name = "mutual-fund-faq-assistant"
version = "0.1.0"
description = "Facts-only mutual fund FAQ assistant (Groww corpus, Groq generation)"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.18.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
